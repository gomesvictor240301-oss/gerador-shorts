<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8" />
  <!-- viewport: faz o site se ajustar à tela do celular -->
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gerador de Shorts</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen">
  <main class="max-w-md mx-auto px-4 py-8">
    <h1 class="text-3xl font-extrabold text-center">✂️ Gerador de <span class="text-yellow-400">Shorts</span></h1>
    <p class="text-center text-zinc-400 mt-2 text-sm">Cole um link do YouTube e receba um corte vertical com legendas.</p>

    <!-- Campo + botão -->
    <div class="mt-8 space-y-3">
      <input id="url" type="url" inputmode="url" placeholder="https://youtube.com/watch?v=..."
        class="w-full rounded-xl bg-zinc-900 border-2 border-zinc-700 focus:border-yellow-400 outline-none px-4 py-4 text-base" />
      <button id="btn"
        class="w-full rounded-xl bg-yellow-400 text-black font-bold text-lg py-4 active:scale-95 transition disabled:opacity-50">
        Gerar Vídeo Curto
      </button>
    </div>

    <!-- Loading -->
    <div id="loading" class="hidden mt-8 text-center">
      <div class="mx-auto h-12 w-12 rounded-full border-4 border-zinc-700 border-t-yellow-400 animate-spin"></div>
      <p id="step" class="mt-4 font-semibold text-yellow-300">Iniciando...</p>
      <p class="text-xs text-zinc-500 mt-1">Pode levar 1 a 3 minutos. Não feche a página.</p>
    </div>

    <!-- Erro -->
    <p id="error" class="hidden mt-6 rounded-xl bg-red-950 border border-red-800 text-red-300 p-4 text-sm"></p>

    <!-- Resultado -->
    <div id="result" class="hidden mt-8">
      <video id="player" controls playsinline
        class="w-full aspect-[9/16] rounded-2xl bg-black border border-zinc-800"></video>
      <a id="download" download="short.mp4"
        class="block text-center mt-4 rounded-xl bg-green-500 text-black font-bold text-lg py-4 active:scale-95 transition">
        ⬇️ Baixar MP4
      </a>
    </div>
  </main>

  <script>
    // Pega os elementos da tela pelo id
    const $ = (id) => document.getElementById(id);
    const API = ""; // vazio = mesmo domínio do site. Se o backend for outro, coloque a URL aqui.

    function show(el, on) { el.classList.toggle("hidden", !on); }

    function setError(msg) {
      $("error").textContent = msg;
      show($("error"), !!msg);
    }

    const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

    $("btn").addEventListener("click", async () => {
      const url = $("url").value.trim();
      if (!url) return setError("Cole um link do YouTube primeiro.");

      // Reseta a tela e entra no estado "carregando"
      setError("");
      show($("result"), false);
      show($("loading"), true);
      $("btn").disabled = true;

      try {
        // 1) Pede ao backend para iniciar o trabalho
        const res = await fetch(`${API}/generate-short`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ url }),
        });
        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          throw new Error(err.detail || "Não consegui iniciar o processo.");
        }
        const { job_id } = await res.json();

        // 2) Pergunta o andamento a cada 2s até terminar (polling)
        while (true) {
          await sleep(2000);
          const s = await (await fetch(`${API}/status/${job_id}`)).json();
          $("step").textContent = s.step; // mostra "Baixando...", "Transcrevendo..."

          if (s.status === "error") throw new Error(s.error || "Erro ao gerar o vídeo.");
          if (s.status === "done") {
            const videoUrl = API + s.url;
            $("player").src = videoUrl;
            $("download").href = videoUrl;
            show($("result"), true);
            break;
          }
        }
      } catch (e) {
        setError(e.message);
      } finally {
        show($("loading"), false);
        $("btn").disabled = false;
      }
    });
  </script>
</body>
</html>
